[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eml4806"
version = "0.1.0"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[tool.setuptools]
package-dir = {"" = "libraries"}

[tool.setuptools.packages.find]
where = ["libraries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libraries"]